<style>
:root{
  --bg:#ffffff; --bg-soft:#f7f8fa; --line:#e6e8ec; --text:#1f2329; --muted:#6b7280;

}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;

.sidebar h1{font-size:17px;margin:0 0 4px}
.sidebar .cap{font-size:12px;color:var(--muted);margin-bottom:18px}

.nav-btn:hover{border-color:#c7cbd6}
.nav-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.note-box{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--primary-soft);color:var(--primary)}
.main{flex:1;min-width:0;padding:28px 36px 80px;max-width:1180px}

h3{font-size:16px;margin:24px 0 10px}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}

.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:960px){.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
@media(max-width:760px){.wrap{flex-direction:column}.sidebar{width:auto;flex:none;height:auto;position:static}.main{padding:20px}.g6,.g4,.g2{grid-template-columns:1fr 1fr}}
table{width:100%;border-collapse:collapse;font-size:13.5px}

.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line)}

.pill.medium{background:#fff7e6;color:#a15c00;border-color:#f3dfb4}

.pill.ok{background:#e9f8ef;color:#0b7a44;border-color:#c6ebd5}
.pill.bad{background:#fdeceb;color:#a12626;border-color:#f5c9c5}
button.act{appearance:none;border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:8px;
  padding:9px 16px;font-size:14px;cursor:pointer;font-weight:600}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.divider{height:1px;background:var(--line);margin:22px 0}
.caption{font-size:12px;color:var(--muted);margin-top:8px}
label.fld{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}

textarea{resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{outline:2px solid var(--primary-soft);border-color:var(--primary)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 16px;font-size:14px;cursor:pointer;color:var(--text)}
.seg button.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.md{font-size:14px}
.md h3{font-size:17px;margin:18px 0 8px}
.md h4{font-size:15px;margin:16px 0 6px}
.md p{margin:8px 0}
.md ul,.md ol{margin:8px 0;padding-left:22px}
.md li{margin:3px 0}

.md strong{font-weight:650}
.hidden{display:none}
.status-sel{border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:13px;background:#fff}
.step-fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.toast{position:fixed;right:22px;bottom:22px;background:#1f2329;color:#fff;padding:10px 16px;border-radius:8px;
  font-size:13px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:none}
footer{margin-top:36px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
</style>

与竞品内容分析\n- 英文内容选题与撰写\n- US 市场 LinkedIn 内容运营\n- 英文 SEO 内容基础建设\n- 线索收集与初步筛选\n\n**4. 执行节奏**\n\n- 第 1–4 天：受众与竞品分析，确认产品卖点与内容基调\n- 第 5–10 天：完成 4 篇英文内容选题与初稿\n- 第 11–25 天：在 LinkedIn 与英文官网 / Blog 发布并互动\n- 第 26–30 天：汇总数据、复盘并给出下一轮建议\n\n**5. 交付物**\n\n- 英文内容选题表（4 条）\n- 4 篇英文内容（LinkedIn + Blog）\n- 发布记录与互动记录\n- 线索汇总表\n- 月度复盘报告\n\n**6. 效果衡量指标**\n\n- 内容曝光量\n- 互动率（互动 / 曝光）\n- 官网访问量（内容渠道）\n- 潜在线索数与有效线索数\n\n**7. 待客户确认的问题**\n\n- 目标客户画像与优先级（团队规模、行业、决策角色）\n- 产品卖点与可公开引用的客户案例\n- 现有官网数据与转化路径\n- 试点预算范围与审批流程\n\n> 以上为模拟试点方案，不构成对实际曝光量、访问量或线索数量的保证。\n","tasks":[{"task_id":"task_001","title":"确认目标受众与产品卖点","owner_role":"策略","window":"第 1–2 天","deliverable":"受众画像、卖点表","status":"已完成（模拟）","proposal_id":"proposal_001"},{"task_id":"task_002","title":"制定英文内容选题","owner_role":"内容运营","window":"第 3–4 天","deliverable":"选题表","status":"已完成（模拟）","proposal_id":"proposal_001"},{"task_id":"task_003","title":"撰写英文内容","owner_role":"内容运营","window":"第 5–10 天","deliverable":"英文内容初稿","status":"进行中（模拟）","proposal_id":"proposal_001"},{"task_id":"task_004","title":"发布并记录数据","owner_role":"运营","window":"第 11–25 天","deliverable":"发布记录","status":"待执行（模拟）","proposal_id":"proposal_001"},{"task_id":"task_005","title":"汇总数据并复盘","owner_role":"运营 / 分析","window":"第 26–30 天","deliverable":"月度复盘报告","status":"待执行（模拟）","proposal_id":"proposal_001"}],"sample":{"linkedin_post":"Teams lose time when important knowledge is scattered across documents and conversations. An AI-powered knowledge assistant can help teams find relevant information faster and keep work moving. If your team is exploring better ways to manage internal knowledge, here's a practical use case to consider: start with the three documents your team searches for most often, connect them to one assistant, and measure how often people find answers without asking a colleague.\n\nCurious how other small teams structure this? We put together a short checklist — comment \"checklist\" and we'll share it.","topic_plan":[{"title":"Why scattered knowledge slows small teams down","angle       closeList(); out.push("<h4>"+inline(m[2])+"</h4>"); continue;
    }
    if((m=line.match(/^>\s?(.*)$/))){ closeList(); out.push("<blockquote>"+inline(m[1])+"</blockquote>"); continue; }
    if(/^-\s+/.test(line)){ if(list!=="ul"){closeList(); out.push("<ul>"); list="ul";}
      out.push("<li>"+inline(line.replace(/^-\s+/,""))+"</li>"); continue; }
    if((m=line.match(/^\d+\.\s+(.*)$/))){ if(list!=="ol"){closeList(); out.push("<ol>"); list="ol";}
      out.push("<li>"+inline(m[1])+"</li>"); continue; }
    closeList(); out.push("<p>"+inline(line)+"</p>");
  }
  closeList(); return out.join("\n");
}

function renderNav(){
  $("#nav").innerHTML = STEPS.map((s,i)=>
    '<button class="nav-btn'+(i===state.step?" active":"")+'" data-step="'+i+'">'+s+'</button>').join("");
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.step));
  $("#lead-select").innerHTML = DATA.leads.map(l=>{
    const a=DATA.per_lead[l.id].analysis;
    return '<option value="'+l.id+'"'+(l.id===state.leadId?" selected":"")+'>'+esc(l.company_name)+" · "+a.score+" 分</option>";
  }).join("");
  $("#lead-select").onchange=(e)=>{ state.leadId=e.target.value; resetLeadState(); render(); };
}
function resetLeadState(){
  state.showExplanation=false; state.showContact=false; state.showProposal=false;
  state.showSample=false; state.showReview=false; state.taskStatus=null; state.subject=null; state.body=null;
}
function go(i){ state.step=i; render(); window.scrollTo({top:0,behavior:"smooth"}); }

function stepAnalysis(){

  return `

  <div class="sub">评分由规则计算（市场 25 + 匹配度 25 + 缺口 25 + 信号 15 + 预算 10），AI 只负责解释。</div>
  <div class="tbl-wrap"><table>
    <thead><tr><th>企业</th><th>行业</th><th>当前市场</th><th>目标市场</th><th>评分</th><th>优先级</th></tr></thead>
    <tbody>${overview.map(o=>`<tr><td><strong>${esc(o.company)}</strong></td><td>${esc(o.industry)}</td>
      <td>${esc(o.cm)}</td><td>${esc(o.tm)}</td><td>${o.score}</td>
      <td><span class="pill ${o.p}">${esc(o.label)}</span></td></tr>`).join("")}
    </tbody></table></div>
  <div class="divider"></div>
  <div class="grid g3">
    <div class="card">
      <h4>${esc(lead.company_name)}</h4>
      <div><strong>产品：</strong>${esc(lead.product)}</div>
      <div><strong>行业：</strong>${esc(lead.industry)}</div>
      <div><strong>目标市场：</strong>${esc((lead.target_markets||[]).join("、")||"未说明")}</div>
      <div class="caption">官网：${esc(lead.website)} · ${esc(lead.notes)}</div>
    </div>
    <div class="card">
      <div class="k" style="font-size:12px;color:var(--muted)">匹配分</div>
      <div style="font-size:26px;font-weight:650">${a.score} <small style="font-size:14px;color:var(--muted)">/ 100</small></div>
      <div class="bar"><i style="width:${a.score}%"></i></div>
    </div>
    <div class="card">
      <div style="font-size:12px;color:var(--muted)">优先级</div>
      <div style="margin-top:8px"><span class="pill ${a.priority}">${esc(a.priority_label)}</span></div>
    </div>
  </div>
  <h3>评分维度</h3>
  <div class="tbl-wrap"><table><thead><tr><th>维度</th><th>得分</th><th>依据</th></tr></thead>
    <tbody>${dimRows}</tbody></table></div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><strong>已知事实</strong><ul style="margin:8px 0 0;padding-left:20px">${facts}</ul></div>
    <div class="card"><strong>需要核验 / 确认</strong><ul style="margin:8px 0 0;padding-left:20px">${verify}</ul></div>
  </div>
  <div class="row" style="margin-top:20px">
    <button class="act ghost" data-act="explain">生成推荐理由与验证问题（AI）</button>
    <button class="act" data-act="toContact">生成联系建议并进入第 2 步</button>
  </div>
  <div class="card ${state.showExplanation?"step-fade":"hidden"}" style="margin-top:16px">
    <div class="md">${md(snap().explanation)}</div>
    <div class="caption">规则 / 模板生成（原版可切换大模型）。</div>
  </div>`;
}

function stepContact(){
  const lead=cur(), a=snap().analysis;
  const c = state.channel==="Email" ? snap().contact_email : snap().contact_linkedin;
  const subject = state.subject!=null && state.subjectFor===state.channel ? state.subject : c.subject;
  const body = state.body!=null && state.subjectFor===state.channel ? state.body : c.body;
  const plan = c.follow_up_plan.map(p=>`<tr><td>${esc(p.day)}</td><td>${esc(p.channel)}</td><td>${esc(p.action)}</td></tr>`).join("");
  return `
  <h2>② 潜在客户联系：准备怎样的联系内容，如何跟进？</h2>
  <div class="sub">内容为规则 / 模板生成，可人工编辑；Demo 不会真实发送。</div>
  <div class="grid g3">
    <div class="card" style="grid-column:span 2">
      <label class="fld">联系渠道</label>
      <div class="seg">
        <button class="${state.channel==="Email"?"on":""}" data-act="ch-Email">Email</button>
        <button class="${state.channel==="LinkedIn"?"on":""}" data-act="ch-LinkedIn">LinkedIn</button>
      </div>
      <label class="fld">沟通目标</label>
      <input type="text" value="预约 20 分钟需求沟通" id="goal">
      <div style="margin-top:14px"><button class="act" data-act="regenContact">生成 / 重新生成联系内容</button></div>
    </div>
    <div class="card">
      <div style="font-size:12px;color:var(--muted)">客户</div>
      <div style="font-size:18px;font-weight:650;margin-bottom:10px">${esc(lead.company_name)}</div>
      <div style="font-size:12px;color:var(--muted)">匹配分</div>
      <div style="font-size:22px;font-weight:650">${a.score} <small style="font-size:13px;color:var(--muted)">/ 100</small></div>
      <div style="margin-top:10px"><span class="pill ${a.priority}">${esc(a.priority_label)}</span></div>
    </div>
  </div>
  <div class="divider"></div>
  <label class="fld">主题</label>
  <input type="text" id="subject" value="${esc(subject)}">
  <label class="fld">正文（可人工编辑）</label>
  <textarea id="body" rows="12">${esc(body)}</textarea>
  <h3>跟进计划</h3>
  <div class="tbl-wrap"><table><thead><tr><th>时间</th><th>渠道</th><th>动作</th></tr></thead>
    <tbody>${plan}</tbody></table></div>
  <div class="caption">生成方式：规则 / 模板。${esc(c.notes)} 本 Demo 不会真实发送邮件或消息。</div>
  <div class="row" style="margin-top:20px">
    <button class="act" data-act="toProposal">模拟客户已回复，进入方案撰写 →</button>
  </div>`;
}

function stepProposal(){
  const lead=cur(), p=snap().proposal;
  return `
  <h2>③ 方案撰写：把客户需求整理成一页式试点方案</h2>
  <div class="sub">基于客户资料与模拟回复生成 30 天试点方案，内容可人工调整。</div>
  <label class="fld">模拟客户回复（可编辑）</label>
  <textarea id="reply" rows="3">我们希望先验证美国市场，希望在一个月内提升英文内容曝光，并获得一批有价值的潜在客户。目前团队没有专职海外内容运营人员，希望先做一个小规模试点。</textarea>
  <div class="row" style="margin-top:14px">
    <button class="act" data-act="genProposal">生成 30 天试点方案</button>
  </div>
  <div class="${state.showProposal?"step-fade":"hidden"}" style="margin-top:18px">
    <div class="card">
      <div class="md">${md(snap().proposal_md)}</div>
    </div>
    <div class="caption">生成方式：规则 / 模板。方案为模拟内容，不代表效果承诺。</div>
    <div class="row" style="margin-top:18px">
      <button class="act" data-act="toDelivery">确认方案（模拟），拆解执行任务 →</button>
    </div>
  </div>`;
}

function stepDelivery(){
  const p=snap().proposal;
  const tasks = snap().tasks;
  const statuses = state.taskStatus || tasks.map(t=>t.status);
  const rows = tasks.map((t,i)=>`<tr><td>${esc(t.title)}</td><td>${esc(t.owner_role)}</td><td>${esc(t.window)}</td>
    <td>${esc(t.deliverable)}</td><td>
    <select class="status-sel" data-i="${i}">${["待执行（模拟）","进行中（模拟）","已完成（模拟）"]
      .map(s=>`<option${statuses[i]===s?" selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("");
  const completed = statuses.filter(s=>s.indexOf("已完成")===0).length;
  const sample = snap().sample;
  const topics = sample.topic_plan.map(t=>`<tr><td>${esc(t.title)}</td><td>${esc(t.angle)}</td></tr>`).join("");
  return `
  <h2>④ 执行交付：把方案变成任务，并展示一个交付样例</h2>
  <div class="sub">任务状态仅保存在当前页面会话中，可切换查看效果。</div>
  <div class="grid g3">
    <div class="metric"><div class="k">任务总数</div><div class="v">${tasks.length}</div></div>
    <div class="metric"><div class="k">已完成（模拟）</div><div class="v">${completed}</div></div>
    <div class="metric"><div class="k">方案周期</div><div class="v">${esc(p.duration)}</div></div>
  </div>
  <h3>执行任务</h3>
  <div class="tbl-wrap"><table><thead><tr><th>任务</th><th>负责人角色</th><th>时间</th><th>交付物</th><th>状态</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
  <div class="caption">任务状态仅保存在当前 Demo 会话中。</div>
  <div class="divider"></div>
  <h3>交付样例：一条 LinkedIn 内容草稿</h3>
  <div class="${state.showSample?"step-fade":"hidden"}">
    <label class="fld">LinkedIn 草稿（可编辑）</label>
    <textarea id="draft" rows="9">${esc(sample.linkedin_post)}</textarea>
    <div class="tbl-wrap" style="margin-top:14px"><table><thead><tr><th>英文选题</th><th>切入角度</th></tr></thead>
      <tbody>${topics}</tbody></table></div>
    <div class="caption">${esc(sample.notes)}</div>
    <div class="row" style="margin-top:18px">
      <button class="act" data-act="toReview">进入数据复盘 →</button>
    </div>
  </div>
  <div class="row ${state.showSample?"hidden":""}" style="margin-top:14px">
    <button class="act" data-act="genSample">生成交付样例</button>
  </div>`;
}

function stepReview(){
  const r=DATA.review, c=r.computed;
  const cards=[["内容发布",c.published_posts],["总曝光",c.impressions.toLocaleString()],
    ["总互动",c.engagements.toLocaleString()],["官网访问",c.website_visits.toLocaleString()],
    ["潜在线索",c.leads],["有效线索",c.qualified_leads]];
  const checks = [["互动率",c.engagement_rate,c.targets.engagement_rate],
    ["官网访问率",c.visit_rate,c.targets.visit_rate],
    ["有效线索占比",c.qualified_lead_share,c.targets.qualified_lead_share]]
    .map(([n,a,t])=>`<tr><td>${n}</td><td>${pct(a)}</td><td>${pct(t)}</td>
      <td><span class="pill ${a>=t?"ok":"bad"}">${a>=t?"达标":"未达标"}</span></td></tr>`).join("");
  const posts = c.posts.map(p=>`<tr><td>${esc(p.title)}</td><td>${esc(p.topic)}</td>
    <td>${p.impressions.toLocaleString()}</td><td>${pct(p.engagement_rate)}</td>
    <td>${p.website_visits}</td><td>${pct(p.visit_rate)}</td><td>${p.leads}</td><td>${p.qualified_leads}</td></tr>`).join("");
  return `
  <h2>⑤ 数据复盘：判断效果并提出下一轮改进</h2>
  <div class="sub">以下为本轮模拟营销数据（非真实业绩）。</div>
  <div class="grid g6">${cards.map(([k,v])=>`<div class="metric"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>
  <h3>目标达成检查</h3>
  <div class="tbl-wrap"><table><thead><tr><th>指标</th><th>本轮结果</th><th>试点目标</th><th>结论</th></tr></thead>
    <tbody>${checks}</tbody></table></div>
  <h3>分内容表现</h3>
  <div class="tbl-wrap"><table><thead><tr><th>内容</th><th>主题</th><th>曝光</th><th>互动率</th>
    <th>官网访问</th><th>访问率</th><th>线索</th><th>有效线索</th></tr></thead><tbody>${posts}</tbody></table></div>
  <div class="row" style="margin-top:18px">
    <button class="act" data-act="genReview">生成复盘结论与下一轮建议（AI）</button>
  </div>
  <div class="${state.showReview?"step-fade":"hidden"}" style="margin-top:16px">
    <div class="card">
      <h4>本轮结论</h4>
      <ul>${r.summary.map(s=>"<li>"+esc(s)+"</li>").join("")}</ul>
      <h4 style="margin-top:14px">发现的问题</h4>
      <ul>${r.issues.map(s=>"<li>"+esc(s)+"</li>").join("")}</ul>
      <h4 style="margin-top:14px">下一轮建议</h4>
      <ul>${r.next_actions.map(s=>"<li>"+esc(s)+"</li>").join("")}</ul>
      <div class="caption">复盘文本由规则生成；原版可切换大模型增强。</div>
    </div>
  </div>`;
}

const RENDERERS=[stepAnalysis,stepContact,stepProposal,stepDelivery,stepReview];
function render(){
  renderNav();
  const html=RENDERERS[state.step]();
  $("#main").innerHTML=html;
  $("#main").classList.remove("step-fade"); void $("#main").offsetWidth; $("#main").classList.add("step-fade");
  bind();
}
function bind(){
  document.querySelectorAll("[data-act]").forEach(el=>{
    el.onclick=()=>handle(el.dataset.act);
  });
  const sub=$("#subject"), body=$("#body");
  if(sub) sub.oninput=()=>{ state.subject=sub.value; state.subjectFor=state.channel; };
  if(body) body.oninput=()=>{ state.body=body.value; state.subjectFor=state.channel; };
  const draft=$("#draft");
  if(draft) draft.oninput=()=>{ snap().sample.linkedin_post=draft.value; };
  document.querySelectorAll(".status-sel").forEach(sel=>{
    sel.onchange=()=>{
      if(!state.taskStatus) state.taskStatus=snap().tasks.map(t=>t.status);
      state.taskStatus[+sel.dataset.i]=sel.value;
      render();
    };
  });
}
function handle(act){
  if(act==="explain"){ state.showExplanation=true; render(); toast("已生成推荐理由（规则 / 模板）"); return; }
  if(act==="toContact"){ go(1); return; }
  if(act && act.startsWith("ch-")){ state.channel=act.slice(3); resetContactEdits(); render(); return; }
  if(act==="regenContact"){ resetContactEdits(); render(); toast("已按「"+state.channel+"」重新生成"); return; }
  if(act==="toProposal"){ go(2); return; }
  if(act==="genProposal"){ state.showProposal=true; render(); toast("已生成 30 天试点方案"); return; }
  if(act==="toDelivery"){ go(3); return; }
  if(act==="genSample"){ state.showSample=true; render(); toast("已生成交付样例"); return; }
  if(act==="toReview"){ go(4); return; }
  if(act==="genReview"){ state.showReview=true; render(); toast("已生成复盘结论"); return; }
}
function resetContactEdits(){ state.subject=null; state.body=null; state.subjectFor=null; }

render();
</script>
